<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OEHSA Interactive Hazard Map</title><link rel="stylesheet" href="css/styles.css"><script defer="defer" src="./bundle.js"></script></head><body><div id="app"><header class="header"><h1>OEHSA Interactive Hazard Map</h1><p>Environmental Hazard Analysis Training Module</p></header><div class="main-content"><div class="control-panel" id="controlPanel"><div class="panel-section"><h3>Hazard Filters</h3><div class="filter-group"><h4>Hazard Type</h4><div class="checkbox-group"><label><input type="checkbox" value="chemical" checked="checked"> Chemical</label> <label><input type="checkbox" value="biological" checked="checked"> Biological</label> <label><input type="checkbox" value="radiological" checked="checked"> Radiological</label> <label><input type="checkbox" value="nuclear" checked="checked"> Nuclear</label> <label><input type="checkbox" value="environmental" checked="checked"> Environmental</label> <label><input type="checkbox" value="physical" checked="checked"> Physical</label></div></div><div class="filter-group"><h4>Environmental Medium</h4><div class="checkbox-group"><label><input type="checkbox" value="air" checked="checked"> Air</label> <label><input type="checkbox" value="water" checked="checked"> Water</label> <label><input type="checkbox" value="soil" checked="checked"> Soil</label> <label><input type="checkbox" value="groundwater" checked="checked"> Groundwater</label></div></div><div class="filter-group"><h4>Severity Level</h4><div class="checkbox-group"><label><input type="checkbox" value="1" checked="checked"> Level 1</label> <label><input type="checkbox" value="2" checked="checked"> Level 2</label> <label><input type="checkbox" value="3" checked="checked"> Level 3</label> <label><input type="checkbox" value="4" checked="checked"> Level 4</label> <label><input type="checkbox" value="5" checked="checked"> Level 5</label></div></div><div class="filter-controls"><button id="clearFilters" class="btn btn-secondary">Clear All Filters</button><div class="hazard-count"><span id="hazardCount">0</span> hazards visible</div></div></div><div class="panel-section"><h3>Legend</h3><div id="legend" class="legend"></div></div></div><div class="map-container"><div id="cesiumContainer" class="cesium-container"></div><div class="map-controls"><button id="zoomIn" class="control-btn" title="Zoom In">+</button> <button id="zoomOut" class="control-btn" title="Zoom Out">-</button> <button id="resetView" class="control-btn" title="Reset View">⌂</button></div><div id="loadingIndicator" class="loading-indicator"><div class="spinner"></div><p>Loading map data...</p></div></div></div><div id="infoPanel" class="info-panel hidden"><div class="info-header"><h3 id="infoTitle">Hazard Information</h3><button id="closeInfo" class="close-btn">&times;</button></div><div class="info-content"><div class="info-item"><label>Type:</label> <span id="infoType">-</span></div><div class="info-item"><label>Location:</label> <span id="infoLocation">-</span></div><div class="info-item"><label>Severity:</label> <span id="infoSeverity">-</span></div><div class="info-item"><label>Environmental Medium:</label> <span id="infoMedium">-</span></div></div></div><div id="infoBubble" class="info-bubble hidden"><div class="bubble-content"><strong id="bubbleType">-</strong> <span id="bubbleSeverity">-</span></div></div></div></body></html>
